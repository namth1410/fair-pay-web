# Traefik terminate TLS bên ngoài → trong container chỉ HTTP thường.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log;
  server_tokens off;

  # ---------- nén ----------
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    image/svg+xml application/manifest+json;

  # ---------- bảo mật ----------
  # Google Identity Services cần script/iframe/style của accounts.google.com.
  # img-src mở https: vì ảnh nhóm/hoá đơn (R2) + avatar Google nằm ở nhiều host.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://static.cloudflareinsights.com; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com/gsi/ https://cloudflareinsights.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # GIS popup cần giữ window.opener.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # ---------- proxy cùng origin (không cần CORS) ----------
  # Supabase Edge Functions: preflight OPTIONS của function đang trả 500 nên
  # trình duyệt không gọi thẳng được → đi qua đây (chỉ POST).
  location /sb-fn/ {
    limit_except POST { deny all; }
    proxy_pass https://cyrbqnvdojozidmtjpsl.supabase.co/functions/v1/;
    proxy_ssl_server_name on;
    proxy_set_header Host cyrbqnvdojozidmtjpsl.supabase.co;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    client_max_body_size 64k;
  }

  # PUT ảnh lên R2 bằng presigned URL (bucket chưa bật CORS). Chữ ký SigV4 phủ
  # host + path + query + content-type + content-length → giữ nguyên path/query,
  # đặt lại Host = endpoint R2. Không có chữ ký hợp lệ thì R2 tự từ chối.
  location /r2-put/ {
    limit_except PUT { deny all; }
    proxy_pass https://fe9618b5f7e7bdba45d8245ce773f68e.r2.cloudflarestorage.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host fe9618b5f7e7bdba45d8245ce773f68e.r2.cloudflarestorage.com;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    client_max_body_size 3m;
    proxy_read_timeout 60s;
  }

  # ---------- cache ----------
  # Vite hash mọi file trong /assets/ → cache vĩnh viễn.
  location /assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location /stickers/ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }

  # HTML luôn revalidate để bản mới hiện ngay.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client https://static.cloudflareinsights.com; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://accounts.google.com/gsi/ https://cloudflareinsights.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  }

  # SPA: mọi route không phải file → index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
